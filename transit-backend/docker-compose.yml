# ============================================================================
# TRANSIT BACKEND - DOCKER COMPOSE
# ============================================================================
# Full stack: PostgreSQL + TimescaleDB + PostGIS, Redis, Backend
# Start with: docker compose up -d
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL with TimescaleDB and PostGIS
  # ==========================================================================
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: transit_postgres
    environment:
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: transit_password
      POSTGRES_DB: transit_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_user -d transit_poc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - transit-network
    restart: unless-stopped

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: transit_redis
    command: >
      redis-server 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - transit-network
    restart: unless-stopped

  # ==========================================================================
  # Backend Service
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_HASH: ${GIT_HASH:-unknown}
    image: transit-backend:latest
    container_name: transit_backend
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transit_poc
      DB_USER: transit_user
      DB_PASSWORD: transit_password
      DB_MAX_CONNS: 50
      DB_MIN_CONNS: 10
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_POOL_SIZE: 50
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      # H3 Geospatial
      H3_RESOLUTION: 9
      # Environment
      ENV: docker
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - transit-network
    restart: unless-stopped

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==========================================================================
# Networks
# ==========================================================================
networks:
  transit-network:
    driver: bridge
